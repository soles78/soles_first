<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIGHT SHIFT — 무료 오픈소스 모션 스튜디오</title>
  <meta name="description" content="anime.js · p5.js · matter-js · PixiJS · Tone.js · D3, 브라우저만으로 만든 78초짜리 오디오비주얼 단편.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2338e8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <div id="p5-layer" aria-hidden="true"></div>
    <div id="pixi-layer" aria-hidden="true"></div>
    <svg id="d3-layer" role="img" aria-label="물리 장면에서 측정한 음별 충돌 횟수 방사형 막대 차트"></svg>

    <div id="titles">
      <h1 id="title"></h1>
      <p id="sub"></p>
      <ul id="credits"></ul>
      <button id="replay" class="btn" type="button">↻ 다시 보기</button>
    </div>

    <div id="caption" aria-live="polite">
      <div class="no"></div>
      <div class="head"></div>
      <div class="desc"></div>
    </div>

    <div id="hud">
      <div id="pills"></div>
      <div id="bar" role="progressbar" aria-label="재생 위치"><i></i></div>
      <button id="mute" class="btn" type="button" aria-pressed="false">소리 끄기</button>
    </div>

    <div id="fade"></div>

    <div id="start">
      <h2>NIGHT SHIFT</h2>
      <p>구독료 0원, 어도비 없음.<br>오픈소스 6개가 브라우저 안에서 만드는 78초짜리 오디오비주얼 단편입니다.</p>
      <button id="startBtn" type="button">▶ 재생</button>
      <small>소리가 나옵니다 · 단축키: 1–5 장면 이동, R 처음부터, M 음소거</small>
      <div id="err" role="alert"></div>
    </div>
  </main>

  <!-- 순서 주의: 라이브러리 → 공용 모듈 → 장면 → 감독 -->
  <script src="vendor/anime.umd.min.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/matter.min.js"></script>
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/tone.js"></script>
  <script src="vendor/p5.min.js"></script>

  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/scene-overture.js"></script>
  <script src="js/scene-flow.js"></script>
  <script src="js/scene-gravity.js"></script>
  <script src="js/scene-data.js"></script>
  <script src="js/scene-outro.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
